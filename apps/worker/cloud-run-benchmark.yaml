# Replace WORKER_IMAGE_DIGEST with the verified immutable image reference.
# Creating this job must not execute it. Obtain workload approval before execution.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: namastevideo-render-benchmark
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: namastevideo-benchmark@namastevideo-dev-20261007.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: '900'
          containers:
            - image: WORKER_IMAGE_DIGEST
              command: ['/usr/bin/tini', '-g', '--', 'node']
              args:
                - --import
                - tsx
                - --input-type=module
                - -e
                - |
                  import fs from 'node:fs/promises';
                  import path from 'node:path';
                  import {execFileSync} from 'node:child_process';
                  import {renderFixture,fixtureSpeech} from './src/plan-v2/fixture.ts';
                  import {renderPlanV2} from './src/plan-v2/render.ts';
                  import {mediaProbePath} from './src/pipeline/media-binaries.ts';
                  const directory='/tmp/namaste-benchmark';
                  const started=performance.now();
                  let phase='render';
                  const memoryPeak=async()=>{
                    for(const file of ['/sys/fs/cgroup/memory.peak','/sys/fs/cgroup/memory/memory.max_usage_in_bytes']) {
                      try {const value=Number((await fs.readFile(file,'utf8')).trim());if(Number.isFinite(value)&&value>0)return value;}catch{}
                    }
                    return null;
                  };
                  console.log(JSON.stringify({event:'silent-render-started'}));
                  try {
                    await renderPlanV2({plan:renderFixture,notes:'',speech:fixtureSpeech(),fixture:true,outputDirectory:directory});
                    phase='qa';
                    const qa=JSON.parse(await fs.readFile(path.join(directory,'qa.json'),'utf8'));
                    if(!qa.passed)throw Error('BENCHMARK_QA_FAILED');
                    phase='decode';
                    console.log(JSON.stringify({event:'silent-render-completed',qa}));
                    const ffmpeg=path.join(path.dirname(mediaProbePath()),'ffmpeg');
                    // Remotion's minimal FFmpeg omits the null muxer's default
                    // wrapped_avframe encoder. rawvideo still fully decodes frames.
                    execFileSync(ffmpeg,['-v','error','-xerror','-i',path.join(directory,'output.mp4'),'-map','0:v:0','-an','-c:v','rawvideo','-f','null','-'],{cwd:path.dirname(ffmpeg),stdio:'pipe',timeout:60000,maxBuffer:1024*1024});
                    const containerPeakBytes=await memoryPeak();
                    console.log(JSON.stringify({event:'silent-render-benchmark',passed:true,decoded:true,qa,elapsedSeconds:Math.round((performance.now()-started)/1000),containerPeakBytes,containerMemoryMeasurement:containerPeakBytes===null?'unavailable':'cgroup peak includes child processes and charged filesystem memory',outputBytes:(await fs.stat(path.join(directory,'output.mp4'))).size,retainedMedia:false}));
                  }catch(error) {
                    // This isolated fixture has no user input or secrets. Do not reuse
                    // raw diagnostic messages in the credentialed production worker.
                    console.error(JSON.stringify({event:'silent-render-failed',phase,errorName:error instanceof Error?error.name:'unknown',message:error instanceof Error?error.message.slice(0,1200):'Unknown failure',elapsedSeconds:Math.round((performance.now()-started)/1000),containerPeakBytes:await memoryPeak()}));
                    process.exitCode=1;
                  }
              resources:
                limits:
                  cpu: '2'
                  memory: 4Gi
