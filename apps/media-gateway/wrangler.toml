name = "namastevideo-media-dev"
main = "../web/src/storage/gateway.ts"
compatibility_date = "2026-10-07"
workers_dev = true
# HTTPS endpoint authorizes every media request; the R2 bucket stays private.
# Supply MEDIA_SERVICE_SECRET using Worker secrets; never commit it here.
[vars]
APP_ORIGIN = "https://namastevideo.ai"
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "namastevideo-dev"
[observability]
enabled = false
