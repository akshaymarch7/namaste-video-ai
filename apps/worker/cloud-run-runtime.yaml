# Create version 1 of each role-scoped secret separately; no values in source.
# Applying this file must not execute a job or enable dashboard dispatch.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: namastevideo-storyboard
  labels:
    cloud.googleapis.com/location: us-east1
spec:
  template:
    spec:
      taskCount: 1
      parallelism: 1
      template:
        spec:
          serviceAccountName: namastevideo-storyboard@namastevideo-dev-20261007.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: '180'
          containers:
            - name: worker
              image: us-central1-docker.pkg.dev/namastevideo-dev-20261007/namastevideo-workers/worker@sha256:f6fb2cdab92ca025d4d1a860059e20fc773b460ca43c30c25d890c873887149f
              args: ['storyboard', '--job', 'required']
              resources:
                limits: {cpu: '2', memory: 4Gi}
              env:
                - name: MONGODB_DATABASE
                  value: namastevideo_dev
                - name: MONGODB_URI
                  valueFrom:
                    secretKeyRef: {name: namastevideo-mongodb-uri, key: '1'}
                - name: GEMINI_API_KEY
                  valueFrom:
                    secretKeyRef: {name: namastevideo-gemini-key, key: '1'}
                - name: GEMINI_MODEL
                  value: gemini-3.5-flash-lite
                - name: OPENAI_API_KEY
                  valueFrom:
                    secretKeyRef: {name: namastevideo-openai-key, key: '2'}
                - name: OPENAI_STORYBOARD_MODEL
                  value: gpt-4.1-mini
                - name: STORYBOARD_PRIMARY_PROVIDER
                  value: openai
                - name: STORYBOARD_FALLBACK_PROVIDER
                  value: gemini
