# Deployment proposal only. Import this Blueprint after account/cost approval.
# Compute: $85/month renderer + $7/month storyboard at Oct 7, 2026 list prices.
services:
  - type: worker
    name: namastevideo-generation-dev
    runtime: docker
    repo: https://github.com/akshaymarch7/namaste-video-ai
    branch: dev
    region: singapore
    plan: 2c-4g
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    dockerCommand: generation
    maxShutdownDelaySeconds: 300
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
  - type: worker
    name: namastevideo-storyboard-dev
    runtime: docker
    repo: https://github.com/akshaymarch7/namaste-video-ai
    branch: dev
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    dockerCommand: storyboard
    maxShutdownDelaySeconds: 300
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
